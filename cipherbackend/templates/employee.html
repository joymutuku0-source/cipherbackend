<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0001;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            color: #166534;
            margin-bottom: 10px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Add Employee</h2>
    <p>Enter the employee information</p>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-row">
            <input type="text" name="first_name" placeholder="First Name" maxlength="50" required>
            <input type="text" name="last_name" placeholder="Last Name" maxlength="50" required>
        </div>

        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="phone_number" placeholder="Phone Number" maxlength="20" required>

        <div class="form-row">
            <input type="text" name="position" placeholder="Position" maxlength="100" required>
            <input type="text" name="department" placeholder="Department" maxlength="100" required>
        </div>

        <input type="date" name="hire_date" required>
        <input type="number" name="salary" placeholder="Salary" min="0" step="0.01" required>

        <button type="submit">Save Employee</button>
    </form>
</div>
</body>
</html>
